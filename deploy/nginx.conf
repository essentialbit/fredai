# FredAI — Nginx reverse proxy template
#
# Puts Fred (running on 127.0.0.1:8080) behind Nginx with TLS, so you can
# expose it on the public internet instead of a bare HTTP port.
#
# Usage:
#   1. Point your domain's DNS A record at this server's public IP.
#   2. Get a certificate:
#        sudo apt install -y certbot
#        certbot certonly --standalone -d yourdomain.com
#   3. Replace every "yourdomain.com" below with your real domain.
#   4. Install:
#        sudo cp deploy/nginx.conf /etc/nginx/sites-available/fredai
#        sudo ln -s /etc/nginx/sites-available/fredai /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#   5. Renew automatically: certbot installs a systemd timer/cron job by
#      default — confirm with `systemctl list-timers | grep certbot`.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    # Let certbot's HTTP-01 challenge through, redirect everything else to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket support — required for Fred's live SocketIO updates
        # (market ticks, alerts, chat responses)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SocketIO long-poll/websocket connections stay open — don't let
        # Nginx's default 60s idle timeout kill them
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
